name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum
      - name: Build linux-amd64
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          GOARCH=amd64 go build -ldflags "-s -w -X main.version=${VERSION}" \
            -o arch-analyzer-linux-amd64 ./cmd/arch-analyzer/
      - uses: actions/upload-artifact@v7
        with:
          name: arch-analyzer-linux-amd64
          path: arch-analyzer-linux-amd64

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum
      - name: Build darwin-arm64
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -ldflags "-s -w -X main.version=${VERSION}" \
            -o arch-analyzer-darwin-arm64 ./cmd/arch-analyzer/
      - uses: actions/upload-artifact@v7
        with:
          name: arch-analyzer-darwin-arm64
          path: arch-analyzer-darwin-arm64

  build-macos-amd64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum
      - name: Build darwin-amd64
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -ldflags "-s -w -X main.version=${VERSION}" \
            -o arch-analyzer-darwin-amd64 ./cmd/arch-analyzer/
      - uses: actions/upload-artifact@v7
        with:
          name: arch-analyzer-darwin-amd64
          path: arch-analyzer-darwin-amd64

  release:
    needs: [build-linux, build-macos-arm64, build-macos-amd64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: binaries/
          merge-multiple: true
      - name: Create checksums
        run: |
          cd binaries
          sha256sum arch-analyzer-* > checksums.txt
          cat checksums.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "arch-analyzer ${GITHUB_REF_NAME}" \
            --generate-notes \
            binaries/arch-analyzer-* \
            binaries/checksums.txt
